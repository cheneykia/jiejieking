<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史教师工作台</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#25282d;
    --muted:#8b9098;
    --line:#e8e9ec;
    --primary:#9b3d32;
    --primary-light:#f7e9e6;
    --sidebar:#202326;
    --sidebar-text:#bfc3c8;
    --sidebar-active:#ffffff;
    --shadow:0 4px 18px rgba(0,0,0,.05);
}

body.dark{
    --bg:#151719;
    --card:#202326;
    --text:#f2f2f2;
    --muted:#9da2aa;
    --line:#33373c;
    --primary:#c96b5d;
    --primary-light:#3b2724;
    --sidebar:#101214;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

button,input,textarea,select{
    font:inherit;
}

button{
    cursor:pointer;
    border:none;
}

/* layout */

.app{
    display:flex;
    height:100vh;
}

/* sidebar */

.sidebar{
    width:230px;
    background:var(--sidebar);
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.logo{
    height:72px;
    display:flex;
    align-items:center;
    padding:0 24px;
    color:white;
    font-weight:700;
    font-size:18px;
    border-bottom:1px solid rgba(255,255,255,.06);
}

.logo small{
    display:block;
    font-size:11px;
    color:#858a90;
    margin-top:4px;
    font-weight:400;
}

.logo-icon{
    width:34px;
    height:34px;
    border-radius:8px;
    background:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:10px;
    color:white;
}

.nav{
    padding:18px 12px;
    flex:1;
}

.nav-title{
    font-size:11px;
    color:#686d74;
    padding:10px 12px;
    letter-spacing:1px;
}

.nav-item{
    padding:11px 13px;
    border-radius:7px;
    margin:3px 0;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    transition:.2s;
}

.nav-item:hover{
    background:rgba(255,255,255,.06);
    color:white;
}

.nav-item.active{
    background:rgba(255,255,255,.1);
    color:white;
}

.sidebar-bottom{
    padding:16px;
    border-top:1px solid rgba(255,255,255,.06);
}

/* main */

.main{
    flex:1;
    min-width:0;
    overflow:auto;
}

.topbar{
    height:72px;
    background:var(--card);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
    position:sticky;
    top:0;
    z-index:10;
}

.search{
    width:360px;
    position:relative;
}

.search input{
    width:100%;
    height:40px;
    border:1px solid var(--line);
    background:var(--bg);
    border-radius:8px;
    padding:0 16px 0 40px;
    outline:none;
    color:var(--text);
}

.search-icon{
    position:absolute;
    left:14px;
    top:11px;
    color:var(--muted);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon-btn{
    width:38px;
    height:38px;
    border-radius:8px;
    background:transparent;
    color:var(--muted);
    font-size:18px;
}

.icon-btn:hover{
    background:var(--bg);
}

.primary-btn{
    background:var(--primary);
    color:white;
    padding:10px 16px;
    border-radius:7px;
    font-size:13px;
}

.primary-btn:hover{
    opacity:.9;
}

/* content */

.content{
    padding:30px;
    max-width:1450px;
    margin:auto;
}

.page-title{
    margin-bottom:24px;
}

.page-title h1{
    font-size:26px;
    margin-bottom:7px;
}

.page-title p{
    color:var(--muted);
    font-size:13px;
}

/* cards */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
}

.stat-card{
    padding:20px;
}

.stat-label{
    color:var(--muted);
    font-size:13px;
}

.stat-number{
    font-size:29px;
    font-weight:700;
    margin-top:8px;
}

.stat-note{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
}

.grid{
    display:grid;
    grid-template-columns:1.6fr 1fr;
    gap:18px;
}

.section{
    padding:22px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.section-header h2{
    font-size:16px;
}

.text-btn{
    color:var(--primary);
    background:none;
    font-size:13px;
}

/* projects */

.project{
    padding:15px 0;
    border-bottom:1px solid var(--line);
}

.project:last-child{
    border-bottom:none;
}

.project-title{
    font-weight:600;
    margin-bottom:8px;
}

.project-meta{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:12px;
}

.tag{
    padding:4px 8px;
    border-radius:4px;
    background:var(--primary-light);
    color:var(--primary);
    font-size:11px;
}

/* todo */

.todo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
}

.todo:last-child{
    border-bottom:none;
}

.todo input{
    accent-color:var(--primary);
}

/* timeline */

.timeline{
    margin-top:15px;
}

.timeline-item{
    display:flex;
    padding:14px 0;
    border-bottom:1px solid var(--line);
}

.timeline-year{
    width:80px;
    font-weight:700;
    color:var(--primary);
}

.timeline-content{
    flex:1;
}

.timeline-title{
    font-weight:600;
}

.timeline-desc{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

/* table */

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

th,td{
    padding:13px 10px;
    border-bottom:1px solid var(--line);
    text-align:left;
}

th{
    color:var(--muted);
    font-weight:500;
}

/* modal */

.modal-mask{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal-mask.show{
    display:flex;
}

.modal{
    width:620px;
    max-width:calc(100% - 30px);
    background:var(--card);
    border-radius:12px;
    padding:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.modal h2{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:13px;
    margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--text);
    border-radius:7px;
    padding:10px;
    outline:none;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.secondary-btn{
    padding:10px 16px;
    border-radius:7px;
    background:var(--bg);
    color:var(--text);
}

/* empty */

.empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.empty-icon{
    font-size:40px;
    margin-bottom:10px;
}

/* responsive */

@media(max-width:1000px){
    .sidebar{
        width:70px;
    }

    .logo-text,
    .nav-item span,
    .nav-title,
    .sidebar-bottom span{
        display:none;
    }

    .logo{
        justify-content:center;
        padding:0;
    }

    .logo-icon{
        margin:0;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){
    .sidebar{
        display:none;
    }

    .content{
        padding:18px;
    }

    .topbar{
        padding:0 15px;
    }

    .search{
        width:180px;
    }

    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">史</div>
            <div class="logo-text">
                历史教师工作台
                <small>History Teacher Desk</small>
            </div>
        </div>

        <nav class="nav">

            <div class="nav-title">工作空间</div>

            <div class="nav-item active" onclick="showPage('dashboard',this)">
                🏠 <span>工作台</span>
            </div>

            <div class="nav-item" onclick="showPage('preparation',this)">
                📚 <span>我的备课</span>
            </div>

            <div class="nav-item" onclick="showPage('materials',this)">
                📜 <span>史料库</span>
            </div>

            <div class="nav-item" onclick="showPage('questions',this)">
                🧩 <span>试题库</span>
            </div>

            <div class="nav-item" onclick="showPage('timeline',this)">
                ⏳ <span>历史时间轴</span>
            </div>

            <div class="nav-item" onclick="showPage('todo',this)">
                ✅ <span>待办事项</span>
            </div>

            <div class="nav-title">系统</div>

            <div class="nav-item" onclick="showPage('data',this)">
                💾 <span>数据管理</span>
            </div>

        </nav>

        <div class="sidebar-bottom">
            <div class="nav-item" onclick="toggleTheme()">
                ◐ <span>切换主题</span>
            </div>
        </div>

    </aside>


    <!-- main -->
    <main class="main">

        <header class="topbar">

            <div class="search">
                <span class="search-icon">⌕</span>
                <input
                    id="searchInput"
                    placeholder="搜索课题、史料、试题……"
                    oninput="globalSearch()"
                >
            </div>

            <div class="top-actions">

                <button class="icon-btn" onclick="toggleTheme()" title="主题">
                    ◐
                </button>

                <button class="primary-btn" onclick="openModal()">
                    ＋ 新建备课
                </button>

            </div>

        </header>


        <div class="content" id="content"></div>

    </main>

</div>


<!-- modal -->

<div class="modal-mask" id="modal">

    <div class="modal">

        <h2>新建备课项目</h2>

        <div class="form-group">
            <label>课题名称</label>
            <input id="newTitle" placeholder="例如：第12课 从明朝建立到清军入关">
        </div>

        <div class="form-group">
            <label>教材</label>
            <select id="newBook">
                <option>中外历史纲要（上）</option>
                <option>中外历史纲要（下）</option>
                <option>选择性必修1 国家制度与社会治理</option>
                <option>选择性必修2 经济与社会生活</option>
                <option>选择性必修3 文化交流与传播</option>
            </select>
        </div>

        <div class="form-group">
            <label>年级</label>
            <select id="newGrade">
                <option>高一</option>
                <option>高二</option>
                <option>高三</option>
            </select>
        </div>

        <div class="form-group">
            <label>备注</label>
            <textarea id="newNote"
                placeholder="记录本次备课的重点、公开课要求或待解决问题……"></textarea>
        </div>

        <div class="modal-actions">
            <button class="secondary-btn" onclick="closeModal()">取消</button>
            <button class="primary-btn" onclick="createProject()">创建项目</button>
        </div>

    </div>

</div>


<script>

/* =========================
   数据
========================= */

let data = JSON.parse(
    localStorage.getItem("historyTeacherDesk")
) || {

    projects:[
        {
            title:"第12课 从明朝建立到清军入关",
            book:"中外历史纲要（上）",

        {

        }
    ],

    materials:[
        {

        },
        {
            title:"罗马帝国与文明交流",
            type:"材料题",

        }
    ],

    timeline:[
        {
            year:"1368",
            title:"明朝建立",
            desc:"朱元璋建立明朝"
        },
        {
            year:"1405",
            title:"郑和首次下西洋",
            desc:"明朝对外交流的重要事件"
        },
        {
            year:"1644",
            title:"清军入关",
            desc:"明清鼎革"
        }
    ],

    todo:[
        "完成第12课PPT",
        "整理青花瓷史料",
        "准备下周公开课",
        "补充高三唐宋专题题目"
    ]

};


/* =========================
   保存
========================= */

function save(){

    localStorage.setItem(
        "historyTeacherDesk",
        JSON.stringify(data)
    );

}


/* =========================
   页面
========================= */

function showPage(page,element){

    document.querySelectorAll(".nav-item")
        .forEach(x=>x.classList.remove("active"));

    if(element){
        element.classList.add("active");
    }

    const content=document.getElementById("content");

    if(page==="dashboard"){
        renderDashboard();
    }

    if(page==="preparation"){
        renderPreparation();
    }

    if(page==="materials"){
        renderMaterials();
    }

    if(page==="questions"){
        renderQuestions();
    }

    if(page==="timeline"){
        renderTimeline();
    }

    if(page==="todo"){
        renderTodo();
    }

    if(page==="data"){
        renderData();
    }

}


/* =========================
   Dashboard
========================= */

function renderDashboard(){

    document.getElementById("content").innerHTML=`

        <div class="page-title">
            <h1>下午好，老师。</h1>
            <p>把今天的备课工作，沉淀成明天可以继续使用的教学资产。</p>
        </div>

        <div class="stats">

            <div class="card stat-card">
                <div class="stat-label">备课项目</div>
                <div class="stat-number">${data.projects.length}</div>
                <div class="stat-note">持续积累中</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">史料</div>
                <div class="stat-number">${data.materials.length}</div>
                <div class="stat-note">文字 · 实物 · 二手</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">试题</div>
                <div class="stat-number">${data.questions.length}</div>
                <div class="stat-note">选择题 · 材料题</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">待办</div>
                <div class="stat-number">${data.todo.length}</div>
                <div class="stat-note">等待处理</div>
            </div>

        </div>


        <div class="grid">

            <div class="card section">

                <div class="section-header">
                    <h2>最近备课</h2>
                    <button class="text-btn"
                        onclick="showPage('preparation')">
                        查看全部
                    </button>
                </div>

                ${data.projects.map(p=>`

                    <div class="project">

                        <div class="project-title">
                            ${p.title}
                        </div>

                        <div class="project-meta">

                            <span>${p.book}</span>

                            <span>·</span>

                            <span>${p.grade}</span>

                            <span class="tag">
                                ${p.type}
                            </span>

                            <span>${p.date}</span>

                        </div>

                    </div>

                `).join("")}

            </div>


            <div class="card section">

                <div class="section-header">
                    <h2>今日待办</h2>
                    <button class="text-btn"
                        onclick="showPage('todo')">
                        管理
                    </button>
                </div>

                ${data.todo.slice(0,5).map((x,i)=>`

                    <div class="todo">

                        <input type="checkbox"
                            onchange="completeTodo(${i})">

                        <span>${x}</span>

                    </div>

                `).join("")}

            </div>

        </div>

    `;

}


/* =========================
   备课
========================= */

function renderPreparation(){

    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h1>我的备课</h1>

            <p>
                把每一节课变成一个可以持续迭代的教学项目。
            </p>

        </div>


        <div class="card section">

            <div class="section-header">

                <h2>全部备课项目</h2>

                <button class="primary-btn"

                </button>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>课题</th>
                            <th>教材</th>
                            <th>年级</th>
                            <th>类型</th>
                            <th>最近修改</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${data.projects.map(p=>`

                            <tr>

                                <td>
                                    <strong>${p.title}</strong>
                                </td>

                                <td>${p.book}</td>

                                <td>${p.grade}</td>

                                <td>
                                    <span class="tag">
                                        ${p.type}
                                    </span>
                                </td>

                                <td>${p.date}</td>

                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        </div>

    `;

}


/* =========================
   史料库
========================= */

function renderMaterials(){

    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h1>史料库</h1>

            <p>
                让史料按照“课题—类型—时代—用途”沉淀。

                        <tr>
                            <th>名称</th>
                            <th>类型</th>

                        </tr>

                    </thead>

                    <tbody>

                        ${data.materials.map(m=>`

                            <tr>
                                <td>${m.title}</td>
                                <td>${m.type}</td>
                                <td>
                                    <span class="tag">${m.tag}</span>
                                </td>
                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        </div>

    `;

}


/* =========================
   试题库
========================= */

function renderQuestions(){

    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h1>试题库</h1>

            <p>
                记录题目、答案、解析、命题立意和对应教材知识点。
            </p>

        </div>


        <div class="card section">

            <div class="section-header">

                <h2>我的题目</h2>

                <button class="primary-btn"
                    onclick="alert('正式版这里加入题目编辑器')">
                    ＋ 新建题目
                </button>

            </div>


            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>
                            <th>题目</th>
                            <th>题型</th>
                            <th>难度</th>
                        </tr>

                    </thead>

                    <tbody>

                        ${data.questions.map(q=>`

                            <tr>
                                <td>${q.title}</td>
                                <td>${q.type}</td>
                                <td>
                                    <span class="tag">
                                        ${q.level}
                                    </span>
                                </td>
                            </tr>

                        `).join("")}

                    </tbody>

                </table>

            </div>

        </div>

    `;

}


/* =========================
   时间轴
========================= */

function renderTimeline(){

    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h1>历史时间轴</h1>

            <p>
                将事件放进时间和空间中，形成历史发展的整体认识。
            </p>

        </div>


        <div class="card section">

            <div class="section-header">

                <h2>我的时间轴</h2>

                <button class="primary-btn"
                    onclick="addTimeline()">
                    ＋ 添加事件
                </button>

            </div>


            <div class="timeline">

                ${data.timeline.map(t=>`

                    <div class="timeline-item">

                        <div class="timeline-year">
                            ${t.year}
                        </div>

                        <div class="timeline-content">

                            <div class="timeline-title">
                                ${t.title}
                            </div>

                            <div class="timeline-desc">
                                ${t.desc}
                            </div>

                        </div>

                    </div>

                `).join("")}

            </div>

        </div>

    `;

}


/* =========================
   待办

    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h1>待办事项</h1>

/* =========================
   数据管理
========================= */

function renderData(){

    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h1>数据管理</h1>

            <p>
                数据掌握在自己手里。建议定期导出备份。
            </p>

        </div>


        <div class="grid">

            <div class="card section">

                <div class="section-header">
                    <h2>备份与恢复</h2>
                </div>

                <p style="color:var(--muted);font-size:13px;line-height:1.8;">
                    当前版本将工作台数据保存在本浏览器中。
                    建议定期导出 JSON 备份文件。
                </p>

                <br>

                <button class="primary-btn"
                    onclick="exportData()">
                    ↓ 导出数据
                </button>

                <label class="secondary-btn"
                    style="display:inline-block;margin-left:8px;">
                    ↑ 导入数据
                    <input
                        type="file"
                        accept=".json"
                        style="display:none"
                        onchange="importData(event)">
                </label>

            </div>


            <div class="card section">

                <div class="section-header">
                    <h2>危险操作</h2>
                </div>

                <p style="color:var(--muted);font-size:13px;line-height:1.8;">
                    清空之前请务必先导出数据。
                </p>

                <br>

                <button
                    class="secondary-btn"
                    onclick="clearData()">
                    清空本地数据
                </button>

            </div>

        </div>

    `;

}


/* =========================
   新建备课
========================= */

function openModal(){

    document.getElementById("modal")
        .classList.add("show");

}

function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

}


function createProject(){

    const title=document.getElementById("newTitle").value.trim();

    if(!title){
        alert("请输入课题名称");
        return;
    }

    data.projects.unshift({

        title:title,

        book:document.getElementById("newBook").value,

        grade:document.getElementById("newGrade").value,

        type:"日常备课",

        date:new Date()
            .toISOString()
            .slice(0,10)

    });

    save();

    closeModal();

    renderPreparation();

}


/* =========================
   待办
========================= */

function addTodo(){

    const text=prompt("请输入新的备课任务：");

    if(!text)return;

    data.todo.push(text);

    save();

    renderTodo();

}


function completeTodo(index){

    data.todo.splice(index,1);

    save();

    renderTodo();

}


/* =========================
   时间轴
========================= */

function addTimeline(){

    const year=prompt("年份：");

    if(!year)return;

    const title=prompt("历史事件：");

    if(!title)return;

    const desc=prompt("事件说明：") || "";

    data.timeline.push({
        year,
        title,
        desc
    });

    data.timeline.sort((a,b)=>Number(a.year)-Number(b.year));

    save();

    renderTimeline();

}


/* =========================
   搜索
========================= */

function globalSearch(){

    const keyword=document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(!keyword){

        renderDashboard();

        return;

    }

    const results=[];

    data.projects.forEach(x=>{
        if(JSON.stringify(x)
            .toLowerCase()
            .includes(keyword)){

            results.push({
                type:"备课",
                title:x.title
            });

        }
    });

    data.materials.forEach(x=>{
        if(JSON.stringify(x)
            .toLowerCase()
            .includes(keyword)){

            results.push({
                type:"史料",
                title:x.title
            });

        }
    });

    data.questions.forEach(x=>{
        if(JSON.stringify(x)
            .toLowerCase()
            .includes(keyword)){

            results.push({
                type:"试题",
                title:x.title
            });

        }
    });


    document.getElementById("content").innerHTML=`

        <div class="page-title">

            <h1>搜索结果</h1>

            <p>
                找到 ${results.length} 条相关内容
            </p>

        </div>

        <div class="card section">

            ${
                results.length
                ?
                results.map(r=>`

                    <div class="project">

                        <div class="project-title">
                            ${r.title}
                        </div>

                        <div class="project-meta">

                            <span class="tag">
                                ${r.type}
                            </span>

                        </div>

                    </div>

                `).join("")
                :
                `<div class="empty">
                    <div class="empty-icon">⌕</div>
                    暂无相关内容
                </div>`
            }

        </div>

    `;

}


/* =========================
   导出
========================= */

function exportData(){

    const blob=new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;

    a.download=
        "历史教师工作台备份_"
        +new Date().toISOString().slice(0,10)
        +".json";

    a.click();

    URL.revokeObjectURL(url);

}


/* =========================
   导入
========================= */

function importData(event){

    const file=event.target.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=function(e){

        try{

            const imported=
                JSON.parse(e.target.result);

            data=imported;

            save();

            alert("数据恢复成功");

            renderDashboard();

        }catch(error){

            alert("数据文件格式错误");

        }

    };

    reader.readAsText(file);

}


/* =========================
   清空
========================= */

function clearData(){

    if(
        !confirm(
            "确定清空全部本地数据吗？建议先导出备份。"
        )
    ){
        return;
    }

    localStorage.removeItem(
        "historyTeacherDesk"
    );

    location.reload();

}


/* =========================
   主题
========================= */

function toggleTheme(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "historyTeacherTheme",
        document.body.classList.contains("dark")
        ?"dark"
        :"light"
    );

}


/* =========================
   初始化
========================= */

if(
    localStorage.getItem("historyTeacherTheme")
    ==="dark"
){

    document.body.classList.add("dark");

}

renderDashboard();

</script>

</body>
</html>
