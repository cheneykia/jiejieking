    &lt;title&gt;历史知识街头霸王 - 教学对战游戏&lt;/title&gt;
    &lt;!-- Tailwind CSS --&gt;
    &lt;script src=&quot;https://metis-online.fbcontent.cn/metis-misc/zgLDUdmazTYc0B4K6Cor.js&quot;&gt;&lt;/script&gt;
    &lt;!-- Anime.js --&gt;
    &lt;script src=&quot;https://metis-online.fbcontent.cn/metis-misc/zZZY40t7WJC7UdQCPACm.js&quot;&gt;&lt;/script&gt;
    &lt;style&gt;
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+Styles+One&amp;display=swap');

        :root {
            --p1-color: #ff2e26;
            --p2-color: #175fff;
            --bg-dark: #090b2f;
        }

        body {
            font-family: 'ZCOOL Styles One', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            user-select: none;
        }

        .pixel-grid {
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 50;
        }

        .hp-bar-container {
            height: 24px;
            background: #333;
            border: 3px solid #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            position: relative;
            overflow: hidden;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.5s ease-out, background-color 0.3s;
        }

        .btn-glow-p1 {
            box-shadow: 0 0 15px var(--p1-color);
            border: 2px solid var(--p1-color);
        }

        .btn-glow-p2 {
            box-shadow: 0 0 15px var(--p2-color);
            border: 2px solid var(--p2-color);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .ko-text {
            font-size: 12rem;
            font-weight: 900;
            font-style: italic;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
            -webkit-text-stroke: 4px white;
        }

        .attack-effect {
            position: absolute;
            width: 60px;
            height: 20px;
            border-radius: 50%;
            filter: blur(5px);
            z-index: 40;
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }

        .timer-progress {
            height: 8px;
            background: #4dff4d;
            box-shadow: 0 0 10px #4dff4d;
        }

        .admin-panel {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* 角色动画 */
        .char-idle {
            animation: idle 2s infinite ease-in-out;
        }
        @keyframes idle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .char-attack-p1 {
            animation: attack-p1 0.5s ease-out;
        }
        @keyframes attack-p1 {
            0% { transform: translateX(0); }
            50% { transform: translateX(100px) scale(1.2); }
            100% { transform: translateX(0); }
        }

        .char-attack-p2 {
            animation: attack-p2 0.5s ease-out;
        }
        @keyframes attack-p2 {
            0% { transform: scaleX(-1) translateX(0); }
            50% { transform: scaleX(-1) translateX(-100px) scale(1.2); }
            100% { transform: scaleX(-1) translateX(0); }
        }

        .char-hurt {
            animation: hurt 0.5s ease-in-out;
            filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5);
        }
        @keyframes hurt {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .char-ko {
            transform-origin: bottom center;
            animation: ko 2s forwards ease-in; /* 延长到2秒，增加慢动作效果 */
            filter: grayscale(100%) brightness(0.5);
        }
        @keyframes ko {
            0% { transform: rotate(0); }
            70% { transform: rotate(60deg) translateY(20px); } /* 慢速倒下过程 */
            100% { transform: rotate(90deg) translateY(50px); opacity: 0.8; }
        }

        /* 失败台词 */
        .defeat-text {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,0,0,0.8), 0 0 20px rgba(255,0,0,0.6);
            animation: defeat-appear 2s forwards ease-out;
            pointer-events: none;
            white-space: nowrap;
        }
        @keyframes defeat-appear {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            30% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            70% { opacity: 1; transform: translateY(-50px) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        /* 角色选择卡片 */
        .char-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            cursor: pointer;
        }
        .char-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }
        .char-selected-p1 {
            border-color: var(--p1-color);
            box-shadow: 0 0 20px var(--p1-color);
            background: rgba(255, 46, 38, 0.2);
        }
        .char-selected-p2 {
            border-color: var(--p2-color);
            box-shadow: 0 0 20px var(--p2-color);
            background: rgba(23, 95, 255, 0.2);
        }

        @media (max-width: 640px) {
            body { overflow-x: hidden; }
            #char-select-screen {
                overflow-y: auto;
                justify-content: flex-start;
                padding: 24px 12px 32px;
            }
            #char-select-screen h1 {
                font-size: 2rem;
                line-height: 1.15;
                text-align: center;
                white-space: normal;
            }
            #char-select-screen h2 {
                font-size: 1.1rem;
                margin-bottom: 20px;
            }
            #char-select-screen &gt; .flex.gap-12 {
                flex-direction: column;
                gap: 18px;
                width: 100%;
                max-width: none;
                padding-left: 0;
                padding-right: 0;
            }
            #char-select-screen &gt; .flex.gap-12 &gt; div {
                width: 100%;
            }
            #char-select-screen #char-grid {
                order: 3;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
            }
            #char-select-screen #p1-preview,
            #char-select-screen #p2-preview {
                width: 120px;
                height: 150px;
            }
            #char-select-screen .mt-12 {
                margin-top: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }
            #game-screen header {
                padding: 12px 8px;
                gap: 6px;
            }
            #game-screen header &gt; div { width: 31% !important; }
            #game-screen header span { font-size: 1rem; }
            #game-screen .hp-bar-container { height: 16px; border-width: 2px; }
            #game-screen main { padding-left: 12px; padding-right: 12px; }
            #question-container {
                padding: 14px;
                margin-bottom: 74px;
            }
            #question-text {
                font-size: 1.35rem;
                line-height: 1.45;
                margin-bottom: 16px;
            }
            #options-grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 10px;
            }
            #options-grid .option-btn {
                padding: 12px;
                font-size: 1rem;
                line-height: 1.45;
                text-align: left;
                min-height: 50px;
            }
            #p1-char, #p2-char { width: 104px !important; }
            #game-screen main &gt; .absolute.inset-0 {
                padding-left: 8px;
                padding-right: 8px;
                padding-bottom: 110px;
            }
            #buzzer-container {
                padding-left: 8px;
                padding-right: 8px;
                bottom: 8px;
            }
            #buzzer-container button { width: 64px; height: 64px; font-size: .85rem; }
            #status-msg { font-size: 1rem; max-width: 180px; line-height: 1.35; }
            #game-screen footer {
                padding: 8px;
                gap: 8px;
                flex-wrap: wrap;
            }
            #game-screen footer &gt; div { gap: 6px; }
            #game-screen footer button { padding: 8px 10px; font-size: .65rem; }
            #game-screen footer &gt; div:last-child { width: 100%; text-align: center; }
        }
    &lt;/style&gt;

                        &lt;h4 class=&quot;text-xl font-bold&quot;&gt;题目预览与配图管理&lt;/h4&gt;
                        &lt;button onclick=&quot;toggleAdmin()&quot; class=&quot;px-6 py-2 bg-yellow-500 text-black font-bold rounded hover:bg-yellow-400&quot;&gt;✅ 确认并开始游戏&lt;/button&gt;
                    &lt;/div&gt;
                    &lt;div id=&quot;question-list&quot; class=&quot;space-y-4 max-h-96 overflow-y-auto&quot;&gt;
                        &lt;!-- 题目列表将动态生成 --&gt;
                    &lt;/div&gt;
                &lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;script type=&quot;module&quot;&gt;
        // --- 游戏配置与状态 ---
        const GamePhase = {
            SELECTING: 'selecting',
            IDLE: 'idle',
            READY: 'ready',
            BUZZING: 'buzzing',
            ANSWERING: 'answering',
            RESULT: 'result',
            KO: 'ko'
        };

        // --- 角色数据 ---
        const characters = [
            { id: 'baiqi', name: '白起', title: '战国杀神', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/oHkz8WRXbdMg2yAVuMrvD6.jpg' },
            { id: 'weiqing', name: '卫青', title: '西汉大将', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/DHdcMsHTVoT4zhQwsCDnta.jpg' },
            { id: 'guanyu', name: '关羽', title: '三国武圣', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/nLZKLxHffAy8iBnS2ApiK5.jpg' },
            { id: 'mulan', name: '花木兰', title: '北魏巾帼', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/B7oUUsFNEUwenQZvABUmna.jpg' },
            { id: 'xuerengui', name: '薛仁贵', title: '大唐神将', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/GQbmA7nGYvib7ABQpXDFGZ.jpg' },
            { id: 'yuefei', name: '岳飞', title: '南宋武穆', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/iwjVL6Y2Z6SBSSttWMpYvb.jpg' },
            { id: 'qijiguang', name: '戚继光', title: '抗倭名将', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/mxhdYbHu4wFtWj26KA3oDC.jpg' },
            { id: 'zhengchenggong', name: '郑成功', title: '收复台湾', img: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/VNak4nStZXBeVYATvxMpqW.jpg' }
        ];

        let state = {
            phase: GamePhase.SELECTING,
            p1: { hp: 100, name: 'PLAYER 1', char: null },
            p2: { hp: 100, name: 'PLAYER 2', char: null },
            currentSelector: 'p1',
            questions: [],
            currentQuestion: null,
            round: 0,
            buzzerWinner: null,
            timer: null,
            timeLeft: 5,
            usedIndexes: [],
            isPaused: false
        };

        // --- 默认题库 ---
        const defaultQuestions = [
            { q: &quot;第1题 西周时期，官职由贵族世代承袭，这一制度是？&quot;, options: [&quot;世官制（世卿世禄制）&quot;, &quot;察举制&quot;, &quot;九品中正制&quot;, &quot;科举制&quot;], a: 0 },
            { q: &quot;第2题 战国时期，秦国通过哪次变法确立了按军功授爵的制度？&quot;, options: [&quot;李悝变法&quot;, &quot;吴起变法&quot;, &quot;商鞅变法&quot;, &quot;王安石变法&quot;], a: 2 },
            { q: &quot;第3题 汉武帝时期，由地方官向中央推荐人才的选官制度是？&quot;, options: [&quot;世官制&quot;, &quot;察举制&quot;, &quot;九品中正制&quot;, &quot;科举制&quot;], a: 1 },
            { q: &quot;第4题 察举制中最主要的常科科目是？&quot;, options: [&quot;贤良方正&quot;, &quot;茂才&quot;, &quot;孝廉&quot;, &quot;明经&quot;], a: 2 },
            { q: &quot;第5题 &ldquo;上品无寒门，下品无势族&rdquo;描述的是哪个制度的弊端？&quot;, options: [&quot;察举制&quot;, &quot;世官制&quot;, &quot;九品中正制&quot;, &quot;科举制&quot;], a: 2 },
            { q: &quot;第6题 秦汉时期考核地方官的主要制度是？&quot;, options: [&quot;考满&quot;, &quot;上计制&quot;, &quot;京察&quot;, &quot;大计&quot;], a: 1 },
            { q: &quot;第7题 科举制正式创立的标志是哪个皇帝设进士科？&quot;, options: [&quot;唐太宗&quot;, &quot;隋文帝&quot;, &quot;隋炀帝&quot;, &quot;宋太祖&quot;], a: 2 },
            { q: &quot;科举制度在哪一年被彻底废除？&quot;, options: [&quot;1898年&quot;, &quot;1901年&quot;, &quot;1905年&quot;, &quot;1911年&quot;], a: 2 },
            { q: &quot;第8题 中国古代选官制度的发展趋势不包括？&quot;, options: [&quot;选拔标准从血缘、门第变为才学&quot;, &quot;选拔方式从举荐变为考试&quot;, &quot;选官权逐渐收归中央&quot;, &quot;选拔范围越来越小&quot;], a: 3 },
            { q: &quot;第9题 英国文官制度的核心原则不包括？&quot;, options: [&quot;公开考试&quot;, &quot;择优录取&quot;, &quot;随政党轮替而更换&quot;, &quot;政治中立&quot;], a: 2 },
            { q: &quot;第10题 英国文官制度最终形成的时间？&quot;, options: [&quot;1805年&quot;, &quot;1855年&quot;, &quot;1870年&quot;, &quot;1883年&quot;], a: 2 },
            { q: &quot;第11题 下列关于西方文官制度的影响，说法正确的是？&quot;, options: [&quot;导致政府工作效率降低&quot;, &quot;有利于政府工作的稳定性和持续性&quot;, &quot;阻碍了国家治理水平的提高&quot;, &quot;加剧了政党分肥制的弊端&quot;], a: 1 }
        ];

        // --- 音效系统 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type = 'sine', duration = 0.2, volume = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sounds = {
            buzz: () =&gt; {
                playSound(880, 'square', 0.08, 0.15);
                setTimeout(() =&gt; playSound(1046, 'square', 0.08, 0.15), 80);
            },
            correct: () =&gt; { 
                playSound(523, 'sine', 0.15, 0.12);
                setTimeout(() =&gt; playSound(659, 'sine', 0.15, 0.12), 120);
                setTimeout(() =&gt; playSound(784, 'sine', 0.25, 0.12), 240);
            },
            wrong: () =&gt; {
                playSound(330, 'sawtooth', 0.15, 0.15);
                setTimeout(() =&gt; playSound(277, 'sawtooth', 0.15, 0.15), 150);
                setTimeout(() =&gt; playSound(220, 'sawtooth', 0.35, 0.15), 300);
            },
            hit: () =&gt; {
                playSound(100, 'square', 0.05, 0.25);
                setTimeout(() =&gt; playSound(80, 'sawtooth', 0.15, 0.2), 50);
            },
            ko: () =&gt; { 
                [440, 370, 311, 262, 220, 185].forEach((f, i) =&gt; 
                    setTimeout(() =&gt; playSound(f, 'sawtooth', 0.4, 0.15), i * 150)
                );
            }
        };

        // --- BGM 系统 (Web Audio API) ---
        const bgmSystem = {
            isPlaying: false,
            interval: null,
            tempo: 130,
            noteIndex: 0,
            baseFreq: 110, // A2
            toggle() {
                if (this.isPlaying) this.stop();
                else this.start();
                this.updateBtn();
            },
            start() {
                if (this.isPlaying) return;
                this.isPlaying = true;
                this.noteIndex = 0;
                const secondsPerBeat = 60.0 / this.tempo;
                const sixteenthNoteTime = secondsPerBeat / 4;
                
                // 立即开始并循环
                this.scheduleNote();
                this.interval = setInterval(() =&gt; this.scheduleNote(), sixteenthNoteTime * 1000);
            },
            stop() {
                this.isPlaying = false;
                clearInterval(this.interval);
            },
            scheduleNote() {
                if (!this.isPlaying) return;
                const time = audioCtx.currentTime;
                
                // Bassline (简单的八度跳跃)
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                
                // 简单的 Bass Pattern: 0-0-12-0
                let freq = this.baseFreq;
                if (this.noteIndex % 4 === 2) freq *= 2; // 高八度
                if (this.noteIndex % 8 === 7) freq *= 0.75; // 变化

                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(0.1, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(time);
                osc.stop(time + 0.1);

                // Hi-hat (噪声)
                if (this.noteIndex % 2 === 0) {
                    const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i &lt; noiseBuffer.length; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = noiseBuffer;
                    const noiseGain = audioCtx.createGain();
                    noiseGain.gain.value = 0.05;
                    noise.connect(noiseGain);
                    noiseGain.connect(audioCtx.destination);
                    noise.start(time);
                }

                // Kick (低频正弦波)
                if (this.noteIndex % 4 === 0) {
                    const kick = audioCtx.createOscillator();
                    const kickGain = audioCtx.createGain();
                    kick.frequency.setValueAtTime(150, time);
                    kick.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
                    kickGain.gain.setValueAtTime(0.4, time);
                    kickGain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
                    kick.connect(kickGain);
                    kickGain.connect(audioCtx.destination);
                    kick.start(time);
                    kick.stop(time + 0.5);
                }

                this.noteIndex = (this.noteIndex + 1) % 16;
            },
            updateBtn() {
                const btn = document.getElementById('bgm-btn');
                btn.innerText = this.isPlaying ? &quot;🔊 关闭BGM&quot; : &quot;🔇 开启BGM&quot;;
                btn.className = this.isPlaying 
                    ? &quot;px-4 py-2 bg-green-600 hover:bg-green-500 rounded text-xs uppercase tracking-widest&quot;
                    : &quot;px-4 py-2 bg-white/10 hover:bg-white/20 rounded text-xs uppercase tracking-widest&quot;;
            }
        };

        window.toggleBGM = () =&gt; bgmSystem.toggle();

        // --- 初始化 ---
        window.onload = () =&gt; {
            loadData();
            initCharSelect();
            
            document.getElementById('start-btn').onclick = startGame;
            document.getElementById('pause-btn').onclick = togglePause;
            document.getElementById('p1-buzzer').onclick = () =&gt; handleBuzz('p1');
            document.getElementById('p2-buzzer').onclick = () =&gt; handleBuzz('p2');
            
            window.addEventListener('keydown', (e) =&gt; {
                if (state.phase === GamePhase.SELECTING) return;
                if (e.key.toLowerCase() === 'a') handleBuzz('p1');
                if (e.key.toLowerCase() === 'l') handleBuzz('p2');
            });
        };

        // --- 角色选择逻辑 ---
        function initCharSelect() {
            const grid = document.getElementById('char-grid');
            grid.innerHTML = '';
            characters.forEach(char =&gt; {
                const card = document.createElement('div');
                card.className = 'char-card rounded-lg p-2 flex flex-col items-center';
                card.id = `char-${char.id}`;
                card.onclick = () =&gt; selectChar(char);
                card.innerHTML = `
                    &lt;div class=&quot;w-full h-24 bg-gray-800 rounded overflow-hidden mb-2&quot;&gt;
                        &lt;img src=&quot;${char.img}&quot; class=&quot;w-full h-full object-cover object-top&quot;&gt;
                    &lt;/div&gt;
                    &lt;div class=&quot;text-sm font-bold&quot;&gt;${char.name}&lt;/div&gt;
                    &lt;div class=&quot;text-xs text-gray-400&quot;&gt;${char.title}&lt;/div&gt;
                `;
                grid.appendChild(card);
            });
        }

        function selectChar(char) {
            if (state.p1.char?.id === char.id || state.p2.char?.id === char.id) return;

            const player = state.currentSelector;
            state[player].char = char;
            
            const card = document.getElementById(`char-${char.id}`);
            card.classList.add(`char-selected-${player}`);
            
            const preview = document.getElementById(`${player}-preview`);
            preview.innerHTML = `&lt;img src=&quot;${char.img}&quot; class=&quot;w-full h-full object-contain object-bottom absolute bottom-0&quot;&gt;`;
            document.getElementById(`${player}-preview-name`).innerText = `${char.title} &middot; ${char.name}`;

            if (player === 'p1') {
                state.currentSelector = 'p2';
            } else {
                const btn = document.getElementById('enter-arena-btn');
                btn.disabled = false;
                btn.className = 'px-12 py-3 bg-yellow-500 text-black font-bold rounded-full hover:bg-yellow-400 text-xl transition-transform transform hover:scale-105 shadow-[0_0_20px_rgba(255,215,0,0.5)]';
            }
        }

        window.enterArena = () =&gt; {
            if (!state.p1.char || !state.p2.char) return;
            
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex', 'flex-col', 'h-full', 'w-full');
            
            document.getElementById('p1-char').src = state.p1.char.img;
            document.getElementById('p2-char').src = state.p2.char.img;
            
            // 直接使用将领名字
            state.p1.name = state.p1.char.name;
            state.p2.name = state.p2.char.name;
            
            state.phase = GamePhase.IDLE;
            updateUI();
        };

        function loadData() {
            // 优先使用嵌入的数据（导出的HTML）
            if (window.EMBEDDED_DATA) {
                state.questions = window.EMBEDDED_DATA.questions || defaultQuestions;
                state.p1.name = window.EMBEDDED_DATA.p1Name || 'PLAYER 1';
                state.p2.name = window.EMBEDDED_DATA.p2Name || 'PLAYER 2';
            } else {
                // 否则从 localStorage 读取
                const savedQ = localStorage.getItem('history_fighter_questions');
                state.questions = savedQ ? JSON.parse(savedQ) : defaultQuestions;
                
                const p1n = localStorage.getItem('p1_name') || 'PLAYER 1';
                const p2n = localStorage.getItem('p2_name') || 'PLAYER 2';
                state.p1.name = p1n;
                state.p2.name = p2n;
            }
            
            document.getElementById('p1-name-input').value = state.p1.name;
            document.getElementById('p2-name-input').value = state.p2.name;
            document.getElementById('p1-name-display').innerText = state.p1.name;
            document.getElementById('p2-name-display').innerText = state.p2.name;
        }

        // --- 核心逻辑 ---
        function startGame() {
            if (state.questions.length === 0) {
                alert(&quot;请先在老师后台添加题目！&quot;);
                return;
            }
            // 尝试自动播放BGM（需要用户交互后才能播放）
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!bgmSystem.isPlaying) bgmSystem.start();
            bgmSystem.updateBtn();

            state.p1.hp = 100;
            state.p2.hp = 100;
            state.round = 0;
            state.usedIndexes = [];
            document.getElementById('start-btn').classList.add('hidden');
            document.getElementById('pause-btn').classList.remove('hidden');
            nextRound();
        }

        function nextRound() {
            if (state.usedIndexes.length &gt;= state.questions.length) {
                state.usedIndexes = []; // 循环使用
            }
            
            state.round++;
            state.phase = GamePhase.BUZZING;
            state.buzzerWinner = null;
            
            // 随机选一题
            let idx;
            do { idx = Math.floor(Math.random() * state.questions.length); }
            while (state.usedIndexes.includes(idx));
            state.usedIndexes.push(idx);
            state.currentQuestion = state.questions[idx];

            updateUI();
            showQuestion();
            startTimer(15);
        }

        function showQuestion() {
            const container = document.getElementById('question-container');
            const qText = document.getElementById('question-text');
            const optionsGrid = document.getElementById('options-grid');
            
            container.classList.remove('hidden');
            
            // 显示题目文本
            qText.innerHTML = state.currentQuestion.q;
            
            // 如果有配图，显示在题目下方
            if (state.currentQuestion.image) {
                const img = document.createElement('img');
                img.src = state.currentQuestion.image;
                img.className = 'max-w-md mx-auto my-4 rounded-lg border-2 border-white/20';
                qText.appendChild(img);
            }
            
            optionsGrid.innerHTML = '';
            
            state.currentQuestion.options.forEach((opt, i) =&gt; {
                const btn = document.createElement('button');
                btn.className = 'option-btn p-6 rounded-lg text-2xl font-bold cursor-not-allowed';
                btn.innerHTML = `&lt;span class=&quot;text-yellow-400 mr-2&quot;&gt;${String.fromCharCode(65+i)}.&lt;/span&gt; ${opt}`;
                btn.onclick = () =&gt; handleAnswer(i);
                optionsGrid.appendChild(btn);
            });

            anime({
                targets: container,
                translateY: [20, 0],
                opacity: [0, 1],
                duration: 500,
                easing: 'easeOutExpo'
            });
        }

        function handleBuzz(player) {
            if (state.phase !== GamePhase.BUZZING || state.isPaused) return;
            
            sounds.buzz();
            state.phase = GamePhase.ANSWERING;
            state.buzzerWinner = player;
            clearInterval(state.timer);
            
            document.getElementById('status-msg').innerText = `${state[player].name} 正在作答...`;
            document.getElementById('status-msg').className = `text-2xl font-bold ${player === 'p1' ? 'text-red-500' : 'text-blue-500'} self-center text-center`;

            // 激活选项
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(btn =&gt; {
                btn.classList.remove('cursor-not-allowed');
                btn.classList.add('hover:bg-white/20', 'cursor-pointer');
            });

            // 抢答按钮视觉反馈
            anime({
                targets: `#${player}-buzzer`,
                scale: [1, 1.2, 1],
                duration: 300
            });

            startTimer(15); // 抢到后有15秒作答时间
        }

        function handleAnswer(index) {
            if (state.phase !== GamePhase.ANSWERING || state.isPaused) return;
            
            clearInterval(state.timer);
            state.phase = GamePhase.RESULT;
            const isCorrect = index === state.currentQuestion.a;
            const winner = state.buzzerWinner;
            const loser = winner === 'p1' ? 'p2' : 'p1';

            const btns = document.querySelectorAll('.option-btn');
            btns[index].style.backgroundColor = isCorrect ? 'rgba(34, 197, 94, 0.4)' : 'rgba(239, 68, 68, 0.4)';
            btns[state.currentQuestion.a].style.backgroundColor = 'rgba(34, 197, 94, 0.6)';
            btns[state.currentQuestion.a].style.border = '3px solid #22c55e';

            if (isCorrect) {
                sounds.correct();
                document.getElementById('status-msg').innerText = &quot;回答正确！攻击！&quot;;
                attack(winner, loser);
                setTimeout(() =&gt; {
                    if (state.phase !== GamePhase.KO) nextRound();
                }, 2000);
            } else {
                sounds.wrong();
                const correctOption = state.currentQuestion.options[state.currentQuestion.a];
                document.getElementById('status-msg').innerHTML = `回答错误！正确答案是：&lt;span class=&quot;text-green-400&quot;&gt;${String.fromCharCode(65 + state.currentQuestion.a)}. ${correctOption}&lt;/span&gt;`;
                takeDamage(winner, 20); // 答错扣20血
                setTimeout(() =&gt; {
                    if (state.phase !== GamePhase.KO) nextRound();
                }, 3000); // 答错后停顿3秒
            }
        }

        function startTimer(seconds) {
            clearInterval(state.timer);
            state.timeLeft = seconds;
            const bar = document.getElementById('timer-bar');
            
            state.timer = setInterval(() =&gt; {
                if (state.isPaused) return; // 暂停时不减少时间
                
                state.timeLeft -= 0.05;
                const percent = (state.timeLeft / seconds) * 100;
                bar.style.width = percent + '%';
                
                if (state.timeLeft &lt;= 0) {
                    clearInterval(state.timer);
                    handleTimeout();
                }
            }, 50);
        }

        function handleTimeout() {
            if (state.phase === GamePhase.BUZZING) {
                document.getElementById('status-msg').innerText = &quot;无人抢答，进入下一题&quot;;
                setTimeout(nextRound, 1500);
            } else if (state.phase === GamePhase.ANSWERING) {
                sounds.wrong();
                document.getElementById('status-msg').innerText = &quot;超时！扣除血量&quot;;
                takeDamage(state.buzzerWinner, 20); // 超时扣20血
                setTimeout(nextRound, 1500);
            }
        }

        function attack(from, to) {
            // 触发攻击动画
            const attacker = document.getElementById(`${from}-char`);
            attacker.classList.remove('char-idle');
            attacker.classList.add(from === 'p1' ? 'char-attack-p1' : 'char-attack-p2');
            
            setTimeout(() =&gt; {
                attacker.classList.remove(from === 'p1' ? 'char-attack-p1' : 'char-attack-p2');
                if (state.phase !== GamePhase.KO) attacker.classList.add('char-idle');
            }, 500);

            const fromEl = document.getElementById(`${from}-char`);
            const toEl = document.getElementById(`${to}-char`);
            const rectFrom = fromEl.getBoundingClientRect();
            const rectTo = toEl.getBoundingClientRect();

            const effect = document.createElement('div');
            effect.className = 'attack-effect';
            effect.style.backgroundColor = from === 'p1' ? 'var(--p1-color)' : 'var(--p2-color)';
            // 从攻击者中心发射
            effect.style.left = (rectFrom.left + rectFrom.width/2) + 'px';
            effect.style.top = (rectFrom.top + rectFrom.height/3) + 'px'; // 稍微偏上一点，对着胸口
            effect.style.boxShadow = `0 0 20px ${effect.style.backgroundColor}`;
            document.body.appendChild(effect);

            anime({
                targets: effect,
                left: rectTo.left + rectTo.width/2,
                top: rectTo.top + rectTo.height/3,
                scale: [1, 3],
                duration: 600,
                easing: 'easeInQuad',
                complete: () =&gt; {
                    effect.remove();
                    sounds.hit();
                    takeDamage(to, 20);
                    // 震动效果
                    anime({
                        targets: 'body',
                        translateX: [-10, 10, -10, 10, 0],
                        duration: 300
                    });
                }
            });
        }

        function takeDamage(player, amount) {
            // 触发受伤动画
            const victim = document.getElementById(`${player}-char`);
            victim.classList.remove('char-idle');
            victim.classList.add('char-hurt');
            
            setTimeout(() =&gt; {
                victim.classList.remove('char-hurt');
                if (state.phase !== GamePhase.KO) victim.classList.add('char-idle');
            }, 500);

            state[player].hp = Math.max(0, state[player].hp - amount);
            updateUI();
            
            if (state[player].hp &lt;= 0) {
                endGame(player === 'p1' ? 'p2' : 'p1');
            }
        }

        function updateUI() {
            // HP Bars
            const p1hp = document.getElementById('p1-hp-bar');
            const p2hp = document.getElementById('p2-hp-bar');
            p1hp.style.width = state.p1.hp + '%';
            p2hp.style.width = state.p2.hp + '%';
            
            document.getElementById('p1-hp-text').innerText = state.p1.hp;
            document.getElementById('p2-hp-text').innerText = state.p2.hp;

            // 直接显示将领名字
            document.getElementById('p1-name-display').innerText = state.p1.name;
            document.getElementById('p2-name-display').innerText = state.p2.name;

            // HP Colors
            [p1hp, p2hp].forEach(bar =&gt; {
                const val = parseInt(bar.style.width);
                if (val &gt; 60) bar.className = 'hp-bar-fill bg-green-500';
                else if (val &gt; 30) bar.className = 'hp-bar-fill bg-yellow-500';
                else bar.className = 'hp-bar-fill bg-red-500';
            });

            document.getElementById('round-number').innerText = state.round.toString().padStart(2, '0');
            
            if (state.phase === GamePhase.BUZZING) {
                document.getElementById('status-msg').innerText = &quot;准备抢答！&quot;;
                document.getElementById('status-msg').className = &quot;text-2xl font-bold text-yellow-400 self-center text-center&quot;;
            }
        }

        function endGame(winner) {
            state.phase = GamePhase.KO;
            clearInterval(state.timer);
            document.getElementById('pause-btn').classList.add('hidden');
            bgmSystem.stop(); // 停止BGM
            bgmSystem.updateBtn();
            sounds.ko();
            
            // 触发倒下动画
            const loser = winner === 'p1' ? 'p2' : 'p1';
            const loserChar = document.getElementById(`${loser}-char`);
            loserChar.classList.remove('char-idle', 'char-hurt');
            loserChar.classList.add('char-ko');
            
            // 显示失败台词
            const rect = loserChar.getBoundingClientRect();
            const defeatText = document.createElement('div');
            defeatText.className = 'defeat-text';
            defeatText.innerText = '下次我一定会击败你的！';
            defeatText.style.left = (rect.left + rect.width / 2 - 100) + 'px'; // 居中对齐
            defeatText.style.top = (rect.top - 30) + 'px';
            document.body.appendChild(defeatText);
            
            // 2秒后移除台词
            setTimeout(() =&gt; defeatText.remove(), 2000);
            
            // 胜利者欢呼动画
            const winnerChar = document.getElementById(`${winner}-char`);
            anime({
                targets: winnerChar,
                translateY: -50,
                scale: 1.2,
                duration: 500,
                direction: 'alternate',
                loop: 3,
                easing: 'easeInOutQuad'
            });
            
            // 延迟显示KO画面，等待慢动作完成
            setTimeout(() =&gt; {
                const screen = document.getElementById('ko-screen');
                const winText = document.getElementById('winner-text');
                winText.innerText = `${state[winner].name} 获得了胜利！`;
                screen.classList.remove('hidden');
                
                anime({
                    targets: '.ko-text',
                    scale: [0, 1.5, 1],
                    rotate: '1turn',
                    duration: 1000,
                    easing: 'easeOutElastic(1, .5)'
                });
            }, 2000); // 等待倒下动画完成
        }

        // --- 老师后台功能 ---
        window.toggleAdmin = () =&gt; {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) {
                const qStr = state.questions.map(q =&gt; 
                    `${q.q}\nA. ${q.options[0]}\nB. ${q.options[1]}\nC. ${q.options[2]}\nD. ${q.options[3]}\n正确答案：${String.fromCharCode(65 + q.a)}`
                ).join('\n\n');
                document.getElementById('question-input').value = qStr;
            }
        };

        window.saveQuestions = () =&gt; {
            const input = document.getElementById('question-input').value;
            const p1n = document.getElementById('p1-name-input').value || 'PLAYER 1';
            const p2n = document.getElementById('p2-name-input').value || 'PLAYER 2';
            
            const blocks = input.split(/\n\s*\n/);
            const parsed = blocks.map(block =&gt; {
                const lines = block.trim().split('\n');
                if (lines.length &lt; 5) return null;
                
                const q = lines[0];
                const options = [
                    lines[1].replace(/^[A-D]\.\s*/, ''),
                    lines[2].replace(/^[A-D]\.\s*/, ''),
                    lines[3].replace(/^[A-D]\.\s*/, ''),
                    lines[4].replace(/^[A-D]\.\s*/, '')
                ];
                const ansMatch = lines[5] ? lines[5].match(/正确答案[：:]\s*([A-D])/) : null;
                const a = ansMatch ? ansMatch[1].charCodeAt(0) - 65 : 0;
                
                return { q, options, a };
            }).filter(x =&gt; x !== null);

            if (parsed.length &gt; 0) {
                state.questions = parsed;
                localStorage.setItem('history_fighter_questions', JSON.stringify(parsed));
                localStorage.setItem('p1_name', p1n);
                localStorage.setItem('p2_name', p2n);
                loadData();
                renderQuestionPreview(); // 显示题目预览
                alert(`成功保存 ${parsed.length} 道题目！`);
            } else {
                alert(&quot;解析失败，请检查格式！&quot;);
            }
        };

        window.resetDefaultQuestions = () =&gt; {
            if (confirm(&quot;确定要恢复默认题库吗？&quot;)) {
                localStorage.removeItem('history_fighter_questions');
                loadData();
                toggleAdmin();
            }
        };

        // --- 导出HTML功能 ---
        window.exportHTML = () =&gt; {
            const p1n = document.getElementById('p1-name-input').value || 'PLAYER 1';
            const p2n = document.getElementById('p2-name-input').value || 'PLAYER 2';
            
            // 解析题库
            const input = document.getElementById('question-input').value;
            const blocks = input.split(/\n\s*\n/);
            const parsed = blocks.map(block =&gt; {
                const lines = block.trim().split('\n');
                if (lines.length &lt; 5) return null;
                
                const q = lines[0];
                const options = [
                    lines[1].replace(/^[A-D]\.\s*/, ''),
                    lines[2].replace(/^[A-D]\.\s*/, ''),
                    lines[3].replace(/^[A-D]\.\s*/, ''),
                    lines[4].replace(/^[A-D]\.\s*/, '')
                ];
                const ansMatch = lines[5] ? lines[5].match(/正确答案[：:]\s*([A-D])/) : null;
                const a = ansMatch ? ansMatch[1].charCodeAt(0) - 65 : 0;
                
                return { q, options, a };
            }).filter(x =&gt; x !== null);

            if (parsed.length === 0) {
                alert(&quot;请先输入题目！&quot;);
                return;
            }

            // 获取当前HTML内容
            const htmlContent = document.documentElement.outerHTML;
            
            // 在 &lt;/head&gt; 前插入嵌入数据
            const embeddedData = `
    &lt;script&gt;
        // 嵌入的题库数据（导出时生成）
        window.EMBEDDED_DATA = {
            questions: ${JSON.stringify(parsed, null, 2)},
            p1Name: &quot;${p1n}&quot;,
            p2Name: &quot;${p2n}&quot;
        };
    &lt;\/script&gt;`;
            
            const modifiedHTML = htmlContent.replace('&lt;/head&gt;', embeddedData + '\n&lt;/head&gt;');
            
            // 创建下载
            const blob = new Blob([modifiedHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '历史知识街头霸王-带题库.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert(`成功导出包含 ${parsed.length} 道题目的网页！\n\n您可以将下载的文件拷贝到U盘，在任何电脑上打开即可使用。`);
        };

        // --- 暂停/继续功能 ---
        function togglePause() {
            state.isPaused = !state.isPaused;
            const btn = document.getElementById('pause-btn');
            
            if (state.isPaused) {
                btn.innerText = '▶ 继续';
                btn.className = 'px-8 py-3 bg-green-500 text-white font-bold rounded-full hover:bg-green-400 transition-colors';
                document.getElementById('status-msg').innerText = '游戏已暂停，老师讲解中...';
                document.getElementById('status-msg').className = 'text-2xl font-bold text-gray-400 self-center text-center';
            } else {
                btn.innerText = '⏸ 暂停';
                btn.className = 'px-8 py-3 bg-orange-500 text-white font-bold rounded-full hover:bg-orange-400 transition-colors';
                updateUI(); // 恢复状态提示
            }
        }

        // --- 题目预览与图片上传 ---
        function renderQuestionPreview() {
            const preview = document.getElementById('question-preview');
            const list = document.getElementById('question-list');
            preview.classList.remove('hidden');
            list.innerHTML = '';

            state.questions.forEach((q, idx) =&gt; {
                const item = document.createElement('div');
                item.className = 'bg-black/40 border border-white/10 p-4 rounded-lg';
                item.innerHTML = `
                    &lt;div class=&quot;flex justify-between items-start mb-2&quot;&gt;
                        &lt;div class=&quot;flex-1&quot;&gt;
                            &lt;div class=&quot;text-yellow-400 font-bold mb-1&quot;&gt;第 ${idx + 1} 题&lt;/div&gt;
                            &lt;div class=&quot;text-sm mb-2&quot;&gt;${q.q}&lt;/div&gt;
                            &lt;div class=&quot;text-xs text-gray-400&quot;&gt;
                                A. ${q.options[0]} | B. ${q.options[1]} | C. ${q.options[2]} | D. ${q.options[3]}
                                &lt;span class=&quot;text-green-400 ml-2&quot;&gt;正确答案：${String.fromCharCode(65 + q.a)}&lt;/span&gt;
                            &lt;/div&gt;
                        &lt;/div&gt;
                        &lt;div class=&quot;ml-4 flex flex-col items-center gap-2&quot;&gt;
                            ${q.image ? `&lt;img src=&quot;${q.image}&quot; class=&quot;w-24 h-24 object-cover rounded border border-white/20&quot;&gt;` : '&lt;div class=&quot;w-24 h-24 bg-gray-800 rounded flex items-center justify-center text-xs text-gray-500&quot;&gt;无配图&lt;/div&gt;'}
                            &lt;label class=&quot;px-3 py-1 bg-blue-600 hover:bg-blue-500 rounded text-xs cursor-pointer&quot;&gt;
                                📷 ${q.image ? '更换' : '上传'}图片
                                &lt;input type=&quot;file&quot; accept=&quot;image/*&quot; class=&quot;hidden&quot; onchange=&quot;uploadImage(${idx}, event)&quot;&gt;
                            &lt;/label&gt;
                            ${q.image ? `&lt;button onclick=&quot;removeImage(${idx})&quot; class=&quot;px-3 py-1 bg-red-600 hover:bg-red-500 rounded text-xs&quot;&gt;删除图片&lt;/button&gt;` : ''}
                        &lt;/div&gt;
                    &lt;/div&gt;
                `;
                list.appendChild(item);
            });
        }

        window.uploadImage = (index, event) =&gt; {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) =&gt; {
                state.questions[index].image = e.target.result;
                localStorage.setItem('history_fighter_questions', JSON.stringify(state.questions));
                renderQuestionPreview();
            };
            reader.readAsDataURL(file);
        };

        window.removeImage = (index) =&gt; {
            delete state.questions[index].image;
            localStorage.setItem('history_fighter_questions', JSON.stringify(state.questions));
            renderQuestionPreview();
        };
    &lt;/script&gt;
